<script>
    const originalFetch = window.fetch;
window.fetch = function(...args) {
    const url = args[0];
    if (typeof url === 'string' && url.match(/\.(mp3|wav|ogg|aac|m4a)/i)) {
        // Intercept audio requests and fake a successful but empty response
        return Promise.resolve(new Response(new Blob(), { 
            status: 200, 
            statusText: 'OK', 
            headers: { 'Content-Type': 'audio/mpeg' } 
        }));
    }
    return originalFetch.apply(this, args);
};

// Also patch XMLHttpRequest just in case Unity is using the older web request style
const originalXHR = XMLHttpRequest.prototype.open;

XMLHttpRequest.prototype.open = function(method, url, ...rest) {
    if (typeof url === "string" &&
        /\.(mp3|wav|ogg|aac|m4a)(?:[?#]|$)/i.test(url)) {
        url = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
    }

    return originalXHR.call(this, method, url, ...rest);
};

const originalAlert = window.alert;

window.alert = function (message) {
    if (typeof message === "string" && /decodeAudioData/i.test(message)) {
        console.log("Blocked alert for audio request:", message);
        return;
    }

    return originalAlert.apply(this, arguments);
};
</script>
